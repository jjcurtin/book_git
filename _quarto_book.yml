project:
  type: book

execute:
  echo: true
  warning: true
  message: true
  freeze: auto

toc: true
toc-depth: 3
css: book.css
callout-icon: false
code-fold: show

book:
  title: "Introduction to Git and Github"
  author: John J. Curtin, PhD
  site-url: https://github.io/jjcurtin/book_git_
  repo-url: https://github.com/jjcurtin/book_git
  repo-branch: main
  repo-actions: [edit]
  page-navigation: true
  reader-mode: true
  chapters:
    - index.qmd
    - 01_setup.qmd
    - 02_tracking_changes.qmd
    - 03_exploring_history.qmd
    - 04_ignoring_files.qmd
    - 05_remotes_github.qmd
    - 06_branches.qmd
    - 07_conflicts.qmd
    - cheatsheet.qmd
